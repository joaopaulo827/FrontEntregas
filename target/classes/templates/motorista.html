<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Tela dos Motoristas</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>        
    </head>
            <style>
            .tela{
            max-width: 500px;
            margin: 40px auto;
            padding: 40px;
            font-size: 44px;
            font-weight: bold;
            background: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0,0,0,.1);
            font-weight: bold;
            color: #1F2937;
            }    
            .motorista {
            max-width: 900px;
            margin: 40px auto;
            padding: 40px;
            }
            th, td {
            border: 1px solid #000;
            padding: 10px;
            text-align: left;
            width: 300px;
            }
            th {
            background-color: #f2f2f2;
            }

        </style>
    <body>
<div th:replace="~{fragments/layout :: custom-header}"></div>

<h3 class="tela">Lista dos Motoristas</h3>
<div class="motorista">
<a class="btn btn-primary" th:href="@{/motorista/adicionarM}">
    Novo Motorista
</a>
    <br><br>
<table>
    <tr>
        <th>Nome</th>
        <th>Status</th>
        <th>Editar</th>
    </tr>

    <tr th:each="f : ${motorista}">
        <td th:text="${f.nome}"></td>
        <td th:text="${f.status}"></td>
        <td>
        <a class="btn btn-secondary" th:href="@{/motorista/editarM(id=${f.id})}">Editar</a>
        </td>        
    </tr>
</table>
</div>    
</body>
</html>
