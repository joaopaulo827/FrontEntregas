<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Tela dos Endereços</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>        
    </head>
            <style>    
            table {
            width: 50%;
            border-collapse: collapse;
            margin-top: 20px;
            }
            th, td {
            border: 1px solid #000;
            padding: 10px;
            text-align: left;
            width: 300px;
            }
            th {
            background-color: #f2f2f2;
            }
            .links{
                margin-top: 10px;
            }
        </style>
    <body>
<div th:replace="~{fragments/layout :: custom-header}"></div>

<h3>Lista dos Endereços</h3>
<a class="btn btn-primary" th:href="@{/endereco/adicionarED}">
    Novo Endereço
</a>
<table>
    <tr>
        <th>Rua</th>
        <th>Numero</th>
        <th>Cidade</th>
    </tr>

    <tr th:each="f : ${endereco}">
        <td th:text="${f.rua}"></td>
        <td th:text="${f.numero}"></td>
        <td th:text="${f.cidade}"></td>
        <td>
        <a class="btn btn-secondary" th:href="@{/endereco/editarED(id=${f.id})}">Editar</a>
        </td>        
    </tr>
</table>
</body>
</html>
