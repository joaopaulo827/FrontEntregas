<!DOCTYPE html>
<html xmlns:th="[thymeleaf.org](http://www.thymeleaf.org)">
<head>
    <title>Editar Motorista</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css)" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
    <script src="[cdn.jsdelivr.net](https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js)"
            integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
            crossorigin="anonymous"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f2f2f2;
            font-family: Arial, sans-serif;
        }
        .container {
            text-align: center;
        }
        h2 {
            font-size: 40px;
            margin-bottom: 20px;
        }
        form {
            background-color: #999999;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            width: 400px;
            margin: 0 auto;
        }
        label {
            display: block;
            font-size: 22px;
            margin-top: 15px;
            text-align: left;
        }
        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            font-size: 18px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 20px;
            color: white;
            background-color: black;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        button:hover {
            background-color: #333333;
        }
        .btn-cancelar {
            display: inline-block;
            margin-top: 15px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>Editar Motorista</h2>
    <main>
        <form th:action="@{/motorista/salvar}" th:object="${motorista}" method="post">
            <input type="hidden" th:field="*{id}"/>
            <label for="nome">Nome:</label>
            <input id="nome" type="text" th:field="*{nome}"/>
            <label for="status">Status:</label>
            <select id="status" th:field="*{status}">
                <option value="ATIVO">ATIVO</option>
                <option value="INATIVO">INATIVO</option>
            </select>
            <button type="submit">Salvar</button>
        </form>
        <a th:href="@{/motorista/list}" class="btn btn-secondary btn-cancelar">
            Cancelar
        </a>
    </main>
</div>
</body>
</html>
