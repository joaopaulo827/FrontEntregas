<html>
    <head>
        <title>Inicio</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>        
        
        <style>
body{
    background-color:#F8FAFC;
}            
.bem-vindo {
    max-width: 900px;
    margin: 40px auto;
    padding: 40px;

    background: #FFFFFF;
    border-radius: 12px;
    box-shadow: 0 4px 12px rgba(0,0,0,.1);

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 40px;
    font-weight: bold;
    color: #1F2937;
        
}
.entrega{
    max-width: 900px;
    margin: 40px auto;
    padding: 40px;
    width: 30%;
    border-collapse: collapse;
    border: 1px solid #000;
}
.motorista{
    max-width: 900px;
    margin: 40px auto;
    padding: 40px;
    width: 10%;
    border-collapse: collapse;
    border: 1px solid #000;   
}
.endereco{
    max-width: 900px;
    margin: 40px auto;
    padding: 40px;
    width: 18%;
    border-collapse: collapse;
    border: 1px solid #000;    
}
        </style>
    </head>
    <body>        
    <div th:replace="~{fragments/layout :: custom-header}"></div>
    <div class="bem-vindo">Bem vindo ao Gerenciamento de Entregas</div>

<table class="motorista" >
    <tr>
        <th>Nome</th>
        <th>Status</th>
    </tr>

    <tr th:each="f : ${motorista}">
        <td th:text="${f.nome}"></td>
        <td th:text="${f.status}"></td>       
    </tr>
</table>
<table class="endereco">
    <tr>
        <th>Rua</th>
        <th>Numero</th>
        <th>Cidade</th>
    </tr>

    <tr th:each="f : ${endereco}">
        <td th:text="${f.rua}"></td>
        <td th:text="${f.numero}"></td>
        <td th:text="${f.cidade}"></td>       
    </tr>
</table>    
<table class="entrega">
    <tr>
        <th>Produto</th>
        <th>Descrição</th>
        <th>Status</th>
        <th>Id Endereco</th>
        <th>Id Motorista</th>
    </tr>
    <tr th:each="f : ${entrega}">
        <td th:text="${f.produto}"></td>
        <td th:text="${f.descricao}"></td>
        <td th:text="${f.status}"></td>
        <td th:text="${f.enderecoId}"></td>
        <td th:text="${f.motoristaId}"></td>        
    </tr>
</table>    
    </body>   
</html>
