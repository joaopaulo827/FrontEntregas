<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Motorista</title>
</head>
        <style>
            body{
                margin: 0;
                padding: 0;
                height: 100vh;
                display: flex;
                justify-content: center;
                align-items: center;
                font-family: Arial, sans-serif;
            }

            .container{
                text-align: center;
            }

            h2{
                font-size: 40px;
                margin-bottom: 20px;
            }

            form{
                background-color: #999999;
                padding: 40px;
                border-radius: 10px;
                box-shadow: 0px 0px 10px rgba(0,0,0,0.3);

                width: 400px;
            }

            label{
                display: block;
                font-size: 22px;
                margin-top: 15px;
            }

            input{
                width: 100%;
                padding: 10px;
                margin-top: 5px;

                font-size: 18px;

                border-radius: 5px;
                border: 1px solid #ccc;

                box-sizing: border-box;
            }

            button{
                margin-top: 20px;
                padding: 10px 20px;

                font-size: 20px;

                color: white;
                background-color: black;

                border: none;
                border-radius: 10px;

                cursor: pointer;
            }
            button:hover{
                background-color: #333333;
            }
            select{
                width:100%;
                height:50px; 
                font-size:20px;
                text-align: center;
            }
        </style>
<body>
<div class="container">
<h2>Novo Motorista</h2>

<form th:action="@{/motorista/adicionarM}"
      th:object="${motorista}"
      method="post">

    <label>Nome</label>
    <input type="text" th:field="*{nome}">
    <br><br>

    <label>Status</label>
    <select th:field="*{status}">
    <option value="ATIVO">ATIVO</option>
    </select>
    <br>
    <button type="submit" class="btn btn-success">
    Salvar
    </button>
</form>
    <br><br>
    <a  th:href="@{/motorista/list}" class="btn btn-secondary">
        Cancelar
    </a>
</div>
</body>
</html>
