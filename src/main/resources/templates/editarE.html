<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Editar Entrega</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    </head>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color:#F8FAFC;
        }
        .container {
            text-align: center;
        }
        h2 {
            font-size: 40px;
            margin-bottom: 20px;
        }
        form {
            background-color: #999999;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
            width: 400px;
            margin: 0 auto;
        }
        label {
            display: block;
            font-size: 22px;
            margin-top: 15px;
            text-align: center;
        }
        input,
        select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            font-size: 18px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            font-size: 20px;
            color: white;
            background-color: black;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        button:hover {
            background-color: #333333;
        }
        .btn-cancelar {
            display: inline-block;
            margin-top: 15px;
        }
        select{
            width:100%;
            height:50px; 
            font-size:20px;
            text-align: center;
        }         
    </style>    
    <body>
    <div class="container">
    <h2>Editar Entrega</h2>
    <main>           
            <form th:action="@{/entrega/salvar}"th:object="${entrega}"method="post">
            <input type="hidden" th:field="*{id}" />
            
            <label>Nome:</label>
            <input type="text" id="produto" oninput="validarEntrega()" th:field="*{produto}" required/><br>
            
            <label>Descrição:</label>
            <input type="text" th:field="*{descricao}" /><br>
            
            <label>Endereço:</label>

            <select th:field="*{enderecoId}">
            <option th:each="e : ${enderecos}"
                th:value="${e.id}"
                th:text="${e.cidade}">
            </option>
            </select>
            <br>
            <button type="submit" id="botao" disabled>Salvar</button>
        </form>
            <br>
            <a class="btn btn-secondary"
            th:href="@{/entrega/list}">
            Cancelar
            </a>            
    </main>
    </div>
    <script>
    function validarEntrega() {
        const nome = document.getElementById("produto");
        const botao = document.getElementById("botao");

        botao.disabled = !(nome.value.trim());
    }
    </script>          
    </body>
</html>
