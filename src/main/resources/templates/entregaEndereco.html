<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Tela dos editais</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>        
    </head>
            <style>
            .tela{
            max-width: 500px;
            margin: 40px auto;
            padding: 40px;
            font-size: 50px;
            font-weight: bold;
            background: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0,0,0,.1);
            font-weight: bold;
            color: #1F2937;
            }                 
            .entrega {
            max-width: 1100px;
            margin: 40px auto;
            padding: 40px;
            }
            th, td {
            border: 1px solid #000;
            padding: 10px;
            text-align: left;
            width: 300px;
            }
            th {
            background-color: #f2f2f2;
            }
        </style>
    <body>
<div th:replace="~{fragments/layout :: custom-header}"></div>
<h3 class="tela">Lista das Entregas</h3>
<div class="entrega">
    <a class="btn btn-primary" th:href="@{/entrega/list}">
    Visualizar as entregas com id
</a>
    <br><br>
<table>
    <tr>
        <th>Produto</th>
        <th>Descrição</th>
        <th>Status</th>
        <th>Rua</th>
        <th>Motorista</th>
    </tr>
    <tr th:each="f : ${entrega}">
        <td th:text="${f.produto}"></td>
        <td th:text="${f.descricao}"></td>
        <td th:text="${f.status}"></td>
        <td th:text="${f.rua}"></td>
        <td th:text="${f.motorista}"></td>         
    </tr>
</table>
</div> 
</body>
</html>
